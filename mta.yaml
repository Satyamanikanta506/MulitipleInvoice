_schema-version: 3.3.0
ID: MultipleInvoice
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: MultipleInvoice-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      stack: cflinuxfs4
      disk-quota: 1024M
      memory: 256M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: MultipleInvoice-destination
      - name: MultipleInvoice-auth
    
  - name: MultipleInvoice
    type: approuter.nodejs
    path: app/ # from cds.env.folders. Consider also cds.env.build.target -> gen/app
    parameters:
      buildpack: nodejs_buildpack
      stack: cflinuxfs4
      keep-existing-routes: true
      disk-quota: 1024M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          timeout: 9600000
          forwardAuthToken: true
      - name: MultipleInvoice-destination
      - name: MultipleInvoice-auth

resources:
  - name: MultipleInvoice-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  
  - name: MultipleInvoice-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
